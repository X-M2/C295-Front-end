name: Update activities and publish site

on:
  # Every day at 06:17 Singapore time. Cron here is in UTC (06:17 SGT = 22:17 UTC the day before).
  schedule:
    - cron: "17 22 * * *"
  # Adds a "Run workflow" button on the Actions tab, for testing
  workflow_dispatch:
  # Any change pushed to main (e.g. website edits) is published too
  push:
    branches: [main]

permissions:
  contents: write # commit data/activities.json
  pages: write # publish to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Pushes only republish the site; the feeds are downloaded on the schedule or the button
      - name: Download feeds and rebuild data/activities.json
        if: github.event_name != 'push'
        run: node scripts/import-feeds.mjs

      - name: Commit data/activities.json if it changed
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- data/activities.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activities.json
          git commit -m "Update activities from feeds"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
