<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121110">
  <title>Journal</title>
  <link rel="preload" href="assets/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js" defer></script>
  <script src="js/sample-data.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/journal.js" defer></script>
</head>
<body>
  <a class="skip" href="#calendar">Skip to the calendar</a>
  <header class="top" data-header></header>

  <main class="page" data-journal>
    <div class="intro">
      <h1 class="display">Journal</h1>
      <p class="lede" data-lede>What you did, what you learned, and the photos to prove it.</p>
    </div>

    <section class="tolog" aria-labelledby="tolog-h" data-tolog>
      <h2 class="group-h" id="tolog-h">To log<span class="group-n" data-tolog-n></span></h2>
      <div data-tolog-body></div>
    </section>

    <section class="cal-wrap" id="calendar" aria-labelledby="month-h">
      <div class="cal-head">
        <h2 class="group-h" id="month-h" data-month aria-live="polite"></h2>
        <div class="cal-nav">
          <button type="button" class="btn btn-sm btn-icon" data-prev aria-label="Previous month"></button>
          <button type="button" class="btn btn-sm btn-icon" data-next aria-label="Next month"></button>
        </div>
        <a class="btn btn-sm cal-other" href="entry.html?new=1">Log something else</a>
      </div>
      <div class="cal-layout">
        <div class="cal" data-cal></div>
        <section class="day-panel" aria-live="polite" data-day></section>
      </div>
    </section>
    <p class="slow-note">Waking up the server. This can take up to a minute the first time.</p>
  </main>

  <footer class="foot">
    <p>C295 project by Zhen Kang, Jun Hao and Xingmeng, Republic Polytechnic.</p>
  </footer>
</body>
</html>
