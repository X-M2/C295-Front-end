<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121110">
  <title>Profile</title>
  <link rel="preload" href="assets/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js" defer></script>
  <script src="js/sample-data.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/profile.js" defer></script>
</head>
<body>
  <a class="skip" href="#settings">Skip to your settings</a>
  <header class="top" data-header></header>

  <main class="page page-profile" data-profile>
    <div class="profile-top">
      <h1 class="display profile-name" data-name>Profile</h1>
      <div class="profile-sub">
        <p class="profile-mail" data-mail></p>
        <button type="button" class="btn btn-sm profile-signout" data-signout-page>Sign out</button>
      </div>
    </div>

    <section id="settings" aria-label="Settings">
      <div class="stubs" data-stubs></div>
      <section class="stub-panel" id="stub-panel" aria-live="polite" data-panel></section>
    </section>
    <p class="slow-note">Waking up the server. This can take up to a minute the first time.</p>
  </main>

  <footer class="foot">
    <p>C295 project by Zhen Kang, Jun Hao and Xingmeng, Republic Polytechnic.</p>
  </footer>
</body>
</html>
